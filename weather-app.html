<!DOCTYPE html>
<html>
<head>
    <title>Simple Weather Application</title>
    <script src="https://cdn.tailwindcss.com"></script> 
</head> 
<body class="bg-gray-100 flex justify-center items-center min-h-screen"> 
    <div class="bg-white p-8 rounded-xl shadow-lg w-96 text-center"> 
        <h1 class="text-3xl font-bold text-gray-800 mb-6"> Weather Information </h1> 
        <form id="location-form"> 
            <label class="block text-gray-700 mb-2"> Enter City Name: </label> 
            <input 
            type="text" 
            id="location" 
            required class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400" > 
            <button type="submit" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg w-full transition" > 
                Get Weather 
            </button> 
        </form> 
        <div id="weather-info" class="mt-6 text-gray-700"></div> 
    </div>
<script>
const form = document.getElementById('location-form');
const weatherInfo = document.getElementById('weather-info');
form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const location = document.getElementById('location').value;
    const apiKey = "87c964c603e1139216735be3a790b85d";
    const url =`https://api.openweathermap.org/data/2.5/weather?q=${location}&appid=${apiKey}&units=metric`;
    try {
        const response = await fetch(url);
        const data = await response.json();
        if (data.cod == 200) {
            weatherInfo.innerHTML = `
                <p><b>City:</b> ${data.name}</p>
                <p><b>Temperature:</b> ${data.main.temp} °C</p>
                <p><b>Weather:</b> ${data.weather[0].description}</p>
            `;
        } 
        else {
            weatherInfo.innerHTML = `<p style="color:red;">City not found</p>`;
        }
    } 
    catch(error) {
        weatherInfo.innerHTML = `<p style="color:red;">Error fetching weather data</p>`;
    }
});
</script>
</body>
</html>
